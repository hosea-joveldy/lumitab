<!doctype html>
<meta charset="utf-8" />
<title>New Tab</title>
<link rel="stylesheet" href="styles/style.css" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<canvas id="scene"></canvas>

<header id="time">
  <div id="clock"></div>
  <div id="date"></div>
</header>

<main id="search">
  <h1 id="greeting"></h1>
  <form action="https://www.google.com/search" method="get">
    <input
      type="text"
      name="q"
      placeholder="search google"
      autocomplete="off"
      spellcheck="false"
      aria-label="search google"
    />
  </form>
  <form action="https://search.nixos.org/packages" method="get">
    <input type="hidden" name="channel" value="unstable" />
    <input
      type="text"
      name="query"
      placeholder="search nixpkgs"
      autocomplete="off"
      spellcheck="false"
      aria-label="search nixpkgs"
    />
  </form>
</main>

<aside id="gh">
  <div class="gh-title">github / luminus</div>
  <div class="gh-row">
    <span id="gh-contribs">–</span><small>contributions (1y)</small>
  </div>
  <div class="gh-title gh-sub">nixpkgs</div>
  <div class="gh-row">
    <span id="gh-merged">–</span><small>merged PRs</small>
  </div>
  <div class="gh-row"><span id="gh-open">–</span><small>open</small></div>
  <div class="gh-latest" id="gh-latest"></div>
</aside>

<div id="label"></div>

<script src="scripts/clock.js"></script>
<script src="scripts/github.js"></script>
<script type="module" src="scripts/solar.js"></script>
