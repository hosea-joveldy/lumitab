<!doctype html>
<meta charset="utf-8" />
<title>New Tab</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles/style.css" />
<canvas id="scene"></canvas>

<button
  id="settings-btn"
  type="button"
  aria-label="settings"
  aria-expanded="false"
>
  <svg
    viewBox="0 0 24 24"
    width="18"
    height="18"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="3" />
    <path
      d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
    />
  </svg>
</button>

<form id="settings" hidden>
  <label
    >your name
    <input
      id="set-name"
      type="text"
      placeholder="optional"
      autocomplete="off"
      spellcheck="false"
      maxlength="40"
    />
  </label>
  <label
    >timezone
    <input
      id="set-tz"
      type="text"
      list="tzlist"
      placeholder="Asia/Jakarta"
      autocomplete="off"
      spellcheck="false"
    />
  </label>
  <datalist id="tzlist"></datalist>
  <label
    >github username
    <input
      id="set-gh"
      type="text"
      placeholder="optional"
      autocomplete="off"
      spellcheck="false"
      maxlength="39"
    />
  </label>
  <div class="set-row">
    <button type="submit">save</button>
    <button type="button" id="set-reset">reset</button>
  </div>
</form>

<header id="time">
  <div id="clock"></div>
  <div id="date"></div>
</header>

<main id="search">
  <h1 id="greeting"></h1>
  <form action="https://www.google.com/search" method="get">
    <input
      type="text"
      name="q"
      placeholder="search google"
      autocomplete="off"
      spellcheck="false"
      aria-label="search google"
    />
  </form>
  <form action="https://search.nixos.org/packages" method="get">
    <input type="hidden" name="channel" value="unstable" />
    <input
      type="text"
      name="query"
      placeholder="search nixos packages"
      autocomplete="off"
      spellcheck="false"
      aria-label="search nixos packages"
    />
  </form>
</main>

<aside id="gh" hidden>
  <div class="gh-title" id="gh-title"></div>
  <div class="gh-row">
    <span id="gh-commits">–</span><small>contributions (1y)</small>
  </div>
  <div id="gh-nix" hidden>
    <div class="gh-title gh-sub">nixpkgs</div>
    <div class="gh-row">
      <span id="gh-merged">–</span><small>merged PRs</small>
    </div>
    <div class="gh-row"><span id="gh-open">–</span><small>open</small></div>
    <div class="gh-latest" id="gh-latest"></div>
  </div>
</aside>

<div id="label"></div>

<script src="scripts/settings.js"></script>
<script src="scripts/clock.js"></script>
<script src="scripts/github.js"></script>
<script type="module" src="scripts/solar.js"></script>
