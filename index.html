<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      :root {
        --bg: #2d353b;
        --bg1: #343f44;
        --fg: #d3c6aa;
        --green: #a7c080;
      }
      body {
        margin: 0;
        height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrains Nerd Font Mono", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }
      #clock {
        font-size: 4rem;
        color: var(--green);
      }
      nav {
        display: flex;
        gap: 1rem;
      }
      nav a {
        background: var(--bg1);
        color: var(--fg);
        text-decoration: none;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
      }
      nav a:hover {
        outline: 1px solid var(--green);
      }
    </style>
  </head>
  <body>
    <div id="clock"></div>
    <nav>
      <a href="https://github.com">github</a>
      <a href="https://search.nixos.org">nixpkgs</a>
      <a href="https://reddit.com/r/unixporn">unixporn</a>
    </nav>
    <script>
      const tick = () =>
        (document.getElementById("clock").textContent =
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          }));
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
